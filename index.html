<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f7f6f3" />
  <meta name="color-scheme" content="light" />
  <title>鼠鼠吃饭 · 上大周边今天吃什么</title>
  <meta name="description" content="回答几个小问题，把口味装进罐子摇一摇，推荐一道上海大学宝山校区周边的具体菜。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐭</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="logo"><span class="logo-mouse" aria-hidden="true">🐭</span>鼠鼠吃饭</h1>
      <p class="tagline">看看今天吃什么</p>
      <ol class="progress" id="progress" aria-label="答题进度"></ol>
    </header>

    <section class="card" id="card" aria-live="polite">
      <p class="loading">正在把菜单搬进来……</p>
    </section>

    <section class="jar-zone">
      <div class="jar-wrap" id="jarWrap">
        <canvas id="jarCanvas" aria-label="口味罐：你选的每个词都会变成一个小球掉进来，点小球可以撤销"></canvas>
        <div class="jar-fallback" id="jarFallback" hidden></div>
      </div>
      <p class="jar-hint" id="jarHint">每选一个词，就有一颗小球掉进罐子 · 点小球可以撤销</p>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="resultFood" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="result" id="result"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script>
    window.Matter || document.write('<script src="https://unpkg.com/matter-js@0.20.0/build/matter.min.js"><\/script>');
  </script>
  <script src="questions.js"></script>
  <script src="recommend.js"></script>
  <script src="jar.js"></script>
  <script src="app.js"></script>
</body>
</html>
