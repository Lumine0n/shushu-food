# Example vhost for app.shushufood.site (Next.js on 127.0.0.1:3100).
# Install as /etc/nginx/sites-available/app.shushufood.site
# Do not replace /etc/nginx/sites-available/shushufood.site (static jar site).

server {
    listen 80;
    listen [::]:80;
    server_name app.shushufood.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_redirect http://localhost:3100/ /;
        proxy_redirect http://127.0.0.1:3100/ /;
        proxy_redirect https://127.0.0.1:3100/ /;
        proxy_redirect https://localhost:3100/ /;
    }
}

# After DNS for app.shushufood.site points to this server:
#   sudo certbot --nginx -d app.shushufood.site
# Certbot will add the 443 server block and certificates.
