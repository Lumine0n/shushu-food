name: 功能分支公开预览

on:
  push:
    branches:
      - cursor/restart-simple-b228
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 整理纯静态网页文件
        run: |
          mkdir _site
          cp index.html style.css app.js jar.js recommend.js questions.js _site/
          mkdir _site/data
          cp data/foods.json _site/data/
          touch _site/.nojekyll
      - name: 启用并配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 发布预览
        id: deployment
        uses: actions/deploy-pages@v4
